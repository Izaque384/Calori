name: Quality check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://calori:calori@localhost:5432/calori
      DATABASE_URL_UNPOOLED: postgresql://calori:calori@localhost:5432/calori
      NEON_AUTH_BASE_URL: https://example.com/neondb/auth
      NEON_AUTH_COOKIE_SECRET: ci-only-cookie-secret-with-at-least-32-characters
      NEXT_PUBLIC_APP_URL: https://calorixx.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
