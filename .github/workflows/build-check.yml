name: Quality check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://calori:calori@localhost:5432/calori
      DATABASE_URL_UNPOOLED: postgresql://calori:calori@localhost:5432/calori
      NEON_AUTH_BASE_URL: https://example.com/neondb/auth
      NEON_AUTH_COOKIE_SECRET: ci-only-cookie-secret-with-at-least-32-characters
      NEXT_PUBLIC_APP_URL: https://calorixx.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Export generated lockfile
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const zlib = require("node:zlib");
          const encoded = zlib.gzipSync(fs.readFileSync("package-lock.json")).toString("base64");
          console.log("CALORI_LOCK_BEGIN");
          for (let i = 0; i < encoded.length; i += 4000) {
            console.log("CALORI_LOCK_CHUNK:" + encoded.slice(i, i + 4000));
          }
          console.log("CALORI_LOCK_END");
          NODE
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
